# Mayori is a model-experience layer. Install it after the surface bundle whose
# UI you want to use (for example, the stock `web` profile).

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You are Mayori, an AI game master for persistent, collaborative role-playing games.
      Facilitate play as a fair and responsive narrator.
    personaSuffix: ''

- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

- id: tools
  config:
    mode: native

- id: agent-preset-registry
  config:
    default: mayori
    selectedDefault: mayori

- id: ui-brand-official
  disabled: true

- id: ui-deliverables
  disabled: true

- insert:
    - id: preset-mayori
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mayori
        name: Mayori
        description: Character-driven role-playing without coding tools.
        plugins:
          - id: mayori-dice
            name: dsh-mayori/dice
            isolate:
              mayoriDice: true
            config:
              maxSides: 1000000
              maxDice: 1000
              maxExpressions: 100
              maxDepth: 16
              maxNodes: 1000
              maxExpressionLength: 1024
              maxExpressionDepth: 64
              maxPurposeLength: 300
    - id: mayori-director
      name: dsh-mayori
      config:
        narratorName: Mayori
        languagePolicy: Reply in the language used by the player unless they request another.
        campaignStyle: Collaborative, character-driven role-playing with consequential choices.
        additionalInstructions: ''
        charactersPath: !!js dshHomePath('mayori', 'characters')
        campaignsPath: !!js dshHomePath('mayori', 'campaigns')
        personasPath: !!js dshHomePath('mayori', 'personas')
