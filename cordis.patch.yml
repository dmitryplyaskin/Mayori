# Mayori is a model-experience layer. Install it after the surface bundle whose
# UI you want to use (for example, the stock `web` profile).

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: ''
    personaSuffix: ''

- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

- id: tools
  config:
    mode: native

- id: agent-preset-registry
  config:
    default: mayori
    selectedDefault: mayori

- id: ui-brand-official
  disabled: true

- id: ui-deliverables
  disabled: true

- insert:
    - id: mayori-plugin-settings
      name: dsh-mayori/plugin-settings
    - id: preset-mayori
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mayori
        name: Mayori
        description: Mayori tools and capabilities.
        plugins:
          - id: mayori-plugins
            name: '@deepseek-ai/cordis-plugin-group'
            group: true
            isolate:
              mayoriDice: true
              mayoriRules: true
              mayoriRollHistory: true
              compaction: true
            config:
              - id: mayori-optional-plugins
                name: dsh-mayori/optional-plugins
    - id: mayori-director
      name: dsh-mayori
      config:
        charactersPath: !!js dshHomePath('mayori', 'characters')
        campaignsPath: !!js dshHomePath('mayori', 'campaigns')
        personasPath: !!js dshHomePath('mayori', 'personas')
        presetsPath: !!js dshHomePath('mayori', 'presets')
